<!DOCTYPE html><html><head><base target="_top"><style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#18243b;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:20px;margin:0}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button,.btn{border:0;border-radius:8px;padding:10px 14px;background:#e3e9f5;color:#18243b;cursor:pointer;font-weight:600}.tabs button.active,.btn.primary{background:#315fce;color:white}.panel{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 12px #17203310;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row .btn{flex:0 0 auto}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd3e1;border-radius:7px;margin:5px 0 12px}label{font-size:13px;font-weight:600}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7ebf2}th{background:#f6f8fc}.muted{color:#64748b;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{background:#f5f7fc;padding:14px;border-radius:9px}.metric strong{font-size:24px;display:block;margin-top:6px}.hidden{display:none}.error{color:#b42318;font-size:12px}.good{color:#087443}.modal{max-width:600px}.actions{white-space:nowrap}.tag{padding:4px 7px;border-radius:20px;background:#edf2ff}.scroll{overflow:auto}@media(max-width:650px){.top{padding:14px}.panel{padding:12px}table{min-width:700px}}
</style></head><body>
<header class="top"><h1>Project Management Web Application</h1><div class="row" style="max-width:340px"><label>Demo role<select id="role" onchange="render()"><option>Project Manager</option><option>IT Employee</option></select></label><label id="profileWrap">Profile<select id="profile" onchange="render()"></select></label></div></header>
<main class="wrap"><nav class="tabs" id="tabs"></nav><div id="app"><div class="panel">Loading application data…</div></div></main>
<script>
let DB={employees:[],projects:[],tasks:[],today:''}, tab='Employees', edit=null;
const $=id=>document.getElementById(id), role=()=> $('role').value, profile=()=> $('profile').value;
function call(fn,args,done){google.script.run.withSuccessHandler(done).withFailureHandler(e=>alert(e.message||e))[fn](...(args||[]));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){call('getBootstrap',[],d=>{DB=d; $('profile').innerHTML=DB.employees.map(e=>`<option value="${e.employee_id}">${esc(e.full_name)} (${e.employee_id})</option>`).join('');render();});}
function refresh(){call('getBootstrap',[],d=>{DB=d;render();});}
function nav(){let names=role()==='Project Manager'?['Employees','Projects','Tasks','Manager Dashboard','Reports']:['My Dashboard','My Tasks'];$('tabs').innerHTML=names.map(n=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()">${n}</button>`).join('');}
function render(){nav();$('profileWrap').style.display=role()==='IT Employee'?'block':'none';if(role()==='IT Employee'&&!['My Dashboard','My Tasks'].includes(tab))tab='My Dashboard';if(role()==='Project Manager'&&!['Employees','Projects','Tasks','Manager Dashboard','Reports'].includes(tab))tab='Employees';({Employees:employees,Projects:projects,Tasks:tasks,'My Dashboard':myDashboard,'My Tasks':myTasks,'Manager Dashboard':managerDashboard,Reports:reports}[tab]||employees)();}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="8">No records found.</td></tr>'}</tbody></table></div>`;}
function employees(){let list=DB.employees; $('app').innerHTML=`<section class="panel"><div class="row"><div><h2>Employees</h2><p class="muted">Register and maintain employee records.</p></div><button class="btn primary" onclick="employeeForm()">+ Add employee</button></div><div class="row"><input id="search" placeholder="Search name, email or ID" oninput="filterEmployees()"><select id="activeFilter" onchange="filterEmployees()"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select></div><div id="employeeTable"></div></section>`;filterEmployees();}
function filterEmployees(){let q=($('search')?.value||'').toLowerCase(),f=$('activeFilter')?.value||'';let a=DB.employees.filter(e=>(!q||[e.employee_id,e.full_name,e.email].join(' ').toLowerCase().includes(q))&&(!f||(f==='Active')===e.is_active));$('employeeTable').innerHTML=table(['ID','Name','Email','Role','Status','Actions'],a.map(e=>`<tr><td>${e.employee_id}</td><td>${esc(e.full_name)}</td><td>${esc(e.email)}</td><td>${esc(e.role)}</td><td>${e.is_active?'Active':'Inactive'}</td><td class="actions"><button class="btn" onclick="viewEmployee('${e.employee_id}')">View</button> <button class="btn" onclick="employeeForm('${e.employee_id}')">Edit</button></td></tr>`).join(''));}
function employeeForm(id){let e=DB.employees.find(x=>x.employee_id===id)||{full_name:'',email:'',role:'IT Employee',is_active:true,version:0};$('app').innerHTML=`<section class="panel modal"><h2>${id?'Edit':'Add'} employee</h2><label>Full name<input id="full_name" value="${esc(e.full_name)}"></label><label>Work email<input id="email" type="email" value="${esc(e.email)}"></label><label>Role<select id="empRole">${['Project Manager','IT Employee'].map(x=>`<option ${e.role===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status<select id="is_active"><option value="true" ${e.is_active?'selected':''}>Active</option><option value="false" ${!e.is_active?'selected':''}>Inactive</option></select></label><div id="formError" class="error"></div><button class="btn" onclick="employees()">Cancel</button> <button class="btn primary" onclick="saveEmployee('${id||''}',${e.version||0})">Save employee</button></section>`;}
function saveEmployee(id,version){let d={employee_id:id,full_name:$('full_name').value,email:$('email').value,role:$('empRole').value,is_active:$('is_active').value==='true',version};call('saveEmployee',[d,role()],r=>{if(!r.ok){$('formError').textContent=r.message+' '+Object.values(r.errors||{}).join(' ');return;}alert(r.message);refresh();});}
function viewEmployee(id){let e=DB.employees.find(x=>x.employee_id===id);alert(`${e.employee_id}\n${e.full_name}\n${e.email}\n${e.role}\n${e.is_active?'Active':'Inactive'}\nVersion ${e.version}`);}
function projects(){ $('app').innerHTML=`<section class="panel"><div class="row"><div><h2>Projects</h2><p class="muted">Create projects and assign an active Project Manager.</p></div><button class="btn primary" onclick="projectForm()">+ Add project</button></div><input id="psearch" placeholder="Search projects" oninput="projectTable()"><div id="projectTable"></div></section>`;projectTable();}
function projectTable(){let q=($('psearch')?.value||'').toLowerCase(),a=DB.projects.filter(p=>(p.title+' '+p.project_id).toLowerCase().includes(q));$('projectTable').innerHTML=table(['ID','Title','Manager','Dates','Status','Actions'],a.map(p=>`<tr><td>${p.project_id}</td><td>${esc(p.title)}</td><td>${esc((DB.employees.find(e=>e.employee_id===p.manager_id)||{}).full_name||p.manager_id)}</td><td>${p.start_date} → ${p.end_date}</td><td>${p.status}</td><td><button class="btn" onclick="projectForm('${p.project_id}')">Edit</button></td></tr>`).join(''));}
function projectForm(id){let p=DB.projects.find(x=>x.project_id===id)||{title:'',description:'',manager_id:'',start_date:DB.today,end_date:DB.today,status:'Planned',version:0};let managers=DB.employees.filter(e=>e.role==='Project Manager'&&e.is_active);$('app').innerHTML=`<section class="panel"><h2>${id?'Edit':'Create'} project</h2><label>Title<input id="ptitle" value="${esc(p.title)}"></label><label>Description<textarea id="pdesc">${esc(p.description)}</textarea></label><label>Project Manager<select id="pmanager">${managers.map(e=>`<option value="${e.employee_id}" ${p.manager_id===e.employee_id?'selected':''}>${esc(e.full_name)}</option>`).join('')}</select></label><div class="row"><label>Start date<input id="pstart" type="date" value="${p.start_date}"></label><label>End date<input id="pend" type="date" value="${p.end_date}"></label></div><label>Status<select id="pstatus">${['Planned','Active','On Hold','Completed'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label><div id="formError" class="error"></div><button class="btn" onclick="projects()">Cancel</button> <button class="btn primary" onclick="saveProject('${id||''}',${p.version||0})">Save project</button></section>`;}
function saveProject(id,version){let d={project_id:id,title:$('ptitle').value,description:$('pdesc').value,manager_id:$('pmanager').value,start_date:$('pstart').value,end_date:$('pend').value,status:$('pstatus').value,version};call('saveProject',[d,role()],r=>{if(!r.ok){$('formError').textContent=r.message+' '+Object.values(r.errors||{}).join(' ');return;}alert(r.message);refresh();});}
function tasks(){ $('app').innerHTML=`<section class="panel"><div class="row"><div><h2>Tasks</h2><p class="muted">Assign tasks to active employees, including Project Managers.</p></div><button class="btn primary" onclick="taskForm()">+ Add task</button></div><div class="row"><select id="tfProject" onchange="taskTable()"><option value="">All projects</option>${DB.projects.map(p=>`<option value="${p.project_id}">${esc(p.title)}</option>`)}</select><select id="tfAssignee" onchange="taskTable()"><option value="">All assignees</option>${DB.employees.map(e=>`<option value="${e.employee_id}">${esc(e.full_name)}</option>`)}</select><select id="tfStatus" onchange="taskTable()"><option value="">All statuses</option>${['To Do','In Progress','Completed'].map(x=>`<option>${x}</option>`)}</select><select id="tfPriority" onchange="taskTable()"><option value="">All priorities</option>${['Low','Medium','High'].map(x=>`<option>${x}</option>`)}</select></div><div id="taskTable"></div></section>`;taskTable();}
function taskTable(){let a=DB.tasks.filter(t=>(!$('tfProject').value||t.project_id===$('tfProject').value)&&(!$('tfAssignee').value||t.assignee_id===$('tfAssignee').value)&&(!$('tfStatus').value||t.status===$('tfStatus').value)&&(!$('tfPriority').value||t.priority===$('tfPriority').value));$('taskTable').innerHTML=table(['ID','Task','Project','Assignee','Priority','Status','Due','Actions'],a.map(t=>{let late=t.due_date<DB.today&&t.status!=='Completed';return `<tr><td>${t.task_id}</td><td>${esc(t.title)} ${late?'<span class="error">OVERDUE</span>':''}</td><td>${t.project_id}</td><td>${t.assignee_id}</td><td>${t.priority}</td><td>${t.status}</td><td>${t.due_date}</td><td><button class="btn" onclick="taskForm('${t.task_id}')">Edit</button> <button class="btn" onclick="removeTask('${t.task_id}')">Delete</button></td></tr>`}).join(''));}
function taskForm(id){let t=DB.tasks.find(x=>x.task_id===id)||{project_id:DB.projects[0]?.project_id,assignee_id:DB.employees.find(e=>e.is_active)?.employee_id,title:'',description:'',priority:'Medium',status:'To Do',due_date:DB.today,version:0};let active=DB.employees.filter(e=>e.is_active);$('app').innerHTML=`<section class="panel"><h2>${id?'Edit':'Create'} task</h2><label>Project<select id="tproject">${DB.projects.map(p=>`<option value="${p.project_id}" ${t.project_id===p.project_id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label><label>Assignee<select id="tassignee">${active.map(e=>`<option value="${e.employee_id}" ${t.assignee_id===e.employee_id?'selected':''}>${esc(e.full_name)} — ${e.role}</option>`).join('')}</select></label><label>Title<input id="ttitle" value="${esc(t.title)}"></label><label>Description<textarea id="tdesc">${esc(t.description)}</textarea></label><div class="row"><label>Priority<select id="tpriority">${['Low','Medium','High'].map(s=>`<option ${t.priority===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Status<select id="tstatus">${['To Do','In Progress','Completed'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Due date<input id="tdue" type="date" value="${t.due_date}"></label></div><div id="formError" class="error"></div><button class="btn" onclick="tasks()">Cancel</button> <button class="btn primary" onclick="saveTask('${id||''}',${t.version||0})">Save task</button></section>`;}
function saveTask(id,version){let d={task_id:id,project_id:$('tproject').value,assignee_id:$('tassignee').value,title:$('ttitle').value,description:$('tdesc').value,priority:$('tpriority').value,status:$('tstatus').value,due_date:$('tdue').value,version};call('saveTask',[d,role()],r=>{if(!r.ok){$('formError').textContent=r.message+' '+Object.values(r.errors||{}).join(' ');return;}alert(r.message);refresh();});}
function removeTask(id){if(confirm('Delete task '+id+'? This cannot be undone.'))call('deleteTask',[id,role()],r=>{alert(r.message);refresh();});}
function myDashboard(){call('getEmployeeDashboard',[profile()],d=>{$('app').innerHTML=`<section class="panel"><h2>My Dashboard</h2><div class="cards">${Object.entries(d.counts).map(([k,v])=>`<div class="metric">${k}<strong>${v}</strong></div>`).join('')}</div><p class="muted">Overdue excludes completed tasks. Today: ${DB.today}</p><button class="btn primary" onclick="tab='My Tasks';render()">Open my tasks</button></section>`;});}
function myTasks(){let mine=DB.tasks.filter(t=>t.assignee_id===profile());$('app').innerHTML=`<section class="panel"><h2>My Tasks</h2>${table(['Task','Project','Priority','Status','Due','Update'],mine.map(t=>`<tr><td>${esc(t.title)}</td><td>${t.project_id}</td><td>${t.priority}</td><td>${t.status}</td><td>${t.due_date}</td><td><select onchange="updateStatus('${t.task_id}',this.value)">${['To Do','In Progress','Completed'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join(''))}</section>`;}
function updateStatus(id,s){call('updateAssignedTaskStatus',[id,profile(),s],r=>{alert(r.message);refresh();});}
function managerDashboard(){let p=DB.projects;$('app').innerHTML=`<section class="panel"><h2>Project Manager Dashboard</h2><label>Project filter<select id="dashProject" onchange="loadManagerDash()"><option value="">All projects</option>${p.map(x=>`<option value="${x.project_id}">${esc(x.title)}</option>`).join('')}</select></label><div id="managerDash"></div></section>`;loadManagerDash();}
function loadManagerDash(){call('getManagerDashboard',[$('dashProject').value],d=>{$('managerDash').innerHTML=`<div class="cards">${Object.entries(d.counts).map(([k,v])=>`<div class="metric">${k}<strong>${v}</strong></div>`).join('')}</div><h3>Project progress</h3>${table(['Project','Tasks','Completed','In progress','To do','Progress'],d.projects.map(p=>`<tr><td>${esc(p.title)}</td><td>${p.total}</td><td>${p.completed}</td><td>${p.inProgress}</td><td>${p.pending}</td><td>${p.progress}%</td></tr>`).join(''))}<h3>Workload (open tasks)</h3>${table(['Employee','Open tasks'],d.workload.map(w=>`<tr><td>${esc(w.name)}</td><td>${w.total}</td></tr>`).join(''))}<h3>Overdue tasks</h3>${table(['Task','Assignee','Due date','Status'],d.overdue.map(t=>`<tr><td>${esc(t.title)}</td><td>${t.assignee_id}</td><td>${t.due_date}</td><td>${t.status}</td></tr>`).join(''))}`;});}
function reports(){call('getReports',[],d=>{$('app').innerHTML=`<section class="panel"><h2>Reports & Analytics</h2><div class="row"><button class="btn primary" onclick="exportCsv()">Download tasks CSV</button><button class="btn" onclick="window.print()">Print report</button></div><h3>Task status distribution</h3>${table(['Status','Count'],d.byStatus.map(x=>`<tr><td>${x.label}</td><td>${x.total}</td></tr>`).join(''))}<h3>Tasks by project</h3>${table(['Project','Tasks'],d.byProject.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.total}</td></tr>`).join(''))}<h3>Tasks by employee</h3>${table(['Employee','Tasks'],d.byEmployee.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.total}</td></tr>`).join(''))}</section>`;});}
function exportCsv(){let rows=[['task_id','project_id','assignee_id','title','priority','status','created_date','due_date'],...DB.tasks.map(t=>[t.task_id,t.project_id,t.assignee_id,t.title,t.priority,t.status,t.created_date,t.due_date])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='task-report.csv';a.click();URL.revokeObjectURL(a.href);}
load();
</script></body></html>
